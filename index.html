<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SUPER UGLY RACER 3000</title>
<style>
  body {
    margin: 0;
    background: #ff00ff;
    font-family: "Comic Sans MS", cursive, sans-serif;
    color: #00ff00;
    text-align: center;
    overflow: hidden;
  }
  h1 {
    background: yellow;
    color: red;
    text-shadow: 3px 3px 0 lime, -2px -2px 0 blue;
    padding: 6px;
    margin: 4px;
    font-size: 28px;
    letter-spacing: 2px;
    transform: skew(-5deg);
  }
  #wrap {
    display: inline-block;
    border: 6px dashed cyan;
    background: #222;
    padding: 4px;
  }
  canvas {
    background: #444;
    display: block;
    image-rendering: pixelated;
  }
  #hud {
    background: black;
    color: #0f0;
    font-size: 18px;
    padding: 4px;
    border: 3px dotted orange;
    margin-top: 4px;
  }
  .blink { animation: blink 0.4s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <h1>>> SUPER UGLY RACER 3000 <<</h1>
  <div id="wrap">
    <canvas id="game" width="320" height="480"></canvas>
    <div id="hud">
      PUNKTE: <span id="score">0</span> &nbsp;|&nbsp;
      SPEED: <span id="speed">0</span> &nbsp;|&nbsp;
      <span class="blink">PFEILTASTEN ODER A/D !!!</span>
    </div>
  </div>

<script>
const c = document.getElementById('game');
const ctx = c.getContext('2d');
const W = c.width, H = c.height;

const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup',   e => keys[e.key.toLowerCase()] = false);

let player = { x: W/2 - 15, y: H - 80, w: 30, h: 50 };
let speed = 3;
let score = 0;
let roadOffset = 0;
let enemies = [];
let gameOver = false;

const enemyColors = ['#00ffff', '#ffff00', '#ff8800', '#ff00ff', '#ffffff'];

function spawnEnemy() {
  const lane = Math.floor(Math.random() * 3);
  const x = 60 + lane * 70 + Math.random()*10;
  enemies.push({
    x: x,
    y: -60,
    w: 30,
    h: 50,
    color: enemyColors[Math.floor(Math.random()*enemyColors.length)]
  });
}

function drawCar(x, y, w, h, color) {
  // body (rectangle, very ugly)
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  // windshield (a wonky polygon)
  ctx.fillStyle = '#000';
  ctx.fillRect(x+4, y+10, w-8, 12);
  // wheels (squares, because circles are too fancy)
  ctx.fillStyle = '#111';
  ctx.fillRect(x-3, y+4, 5, 10);
  ctx.fillRect(x+w-2, y+4, 5, 10);
  ctx.fillRect(x-3, y+h-14, 5, 10);
  ctx.fillRect(x+w-2, y+h-14, 5, 10);
  // a random "detail" stripe
  ctx.fillStyle = '#fff';
  ctx.fillRect(x+w/2-1, y+h-15, 2, 10);
}

function drawRoad() {
  // grass on the sides (lime green, terrible)
  ctx.fillStyle = '#0c0';
  ctx.fillRect(0, 0, 40, H);
  ctx.fillRect(W-40, 0, 40, H);

  // road
  ctx.fillStyle = '#555';
  ctx.fillRect(40, 0, W-80, H);

  // edges
  ctx.fillStyle = '#fff';
  ctx.fillRect(40, 0, 4, H);
  ctx.fillRect(W-44, 0, 4, H);

  // dashed center lines (two)
  ctx.fillStyle = '#ff0';
  for (let i = -1; i < 12; i++) {
    const y = (i*60 + roadOffset) % (H + 60);
    ctx.fillRect(W/2 - 30, y, 6, 30);
    ctx.fillRect(W/2 + 24, y, 6, 30);
  }
}

function drawTrees() {
  // very ugly "trees" on the grass
  ctx.fillStyle = '#063';
  for (let i = 0; i < 8; i++) {
    const ty = (i*80 + roadOffset*1.5) % (H+80);
    ctx.fillRect(10, ty, 20, 30);
    ctx.fillRect(W-30, ty+20, 20, 30);
    ctx.fillStyle = '#420';
    ctx.fillRect(18, ty+30, 4, 10);
    ctx.fillRect(W-22, ty+50, 4, 10);
    ctx.fillStyle = '#063';
  }
}

function update() {
  if (gameOver) return;

  if (keys['arrowleft'] || keys['a']) player.x -= 4;
  if (keys['arrowright'] || keys['d']) player.x += 4;
  if (keys['arrowup'] || keys['w']) speed = Math.min(speed + 0.05, 10);
  if (keys['arrowdown'] || keys['s']) speed = Math.max(speed - 0.1, 2);

  player.x = Math.max(44, Math.min(W - 44 - player.w, player.x));

  roadOffset = (roadOffset + speed) % 60;

  for (const e of enemies) e.y += speed + 2;
  enemies = enemies.filter(e => e.y < H + 60);

  if (Math.random() < 0.03 + speed*0.003) spawnEnemy();

  for (const e of enemies) {
    if (player.x < e.x + e.w && player.x + player.w > e.x &&
        player.y < e.y + e.h && player.y + player.h > e.y) {
      gameOver = true;
    }
  }

  score += Math.floor(speed);
  document.getElementById('score').textContent = score;
  document.getElementById('speed').textContent = speed.toFixed(1);
}

function render() {
  drawRoad();
  drawTrees();

  for (const e of enemies) drawCar(e.x, e.y, e.w, e.h, e.color);

  drawCar(player.x, player.y, player.w, player.h, '#e00');

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, H/2 - 60, W, 120);
    ctx.fillStyle = '#f0f';
    ctx.font = 'bold 30px "Comic Sans MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER!!!', W/2, H/2 - 10);
    ctx.fillStyle = '#0f0';
    ctx.font = '16px "Comic Sans MS", sans-serif';
    ctx.fillText('Leertaste = neu starten', W/2, H/2 + 20);
    ctx.fillText('Score: ' + score, W/2, H/2 + 45);
  }
}

function reset() {
  player.x = W/2 - 15;
  enemies = [];
  speed = 3;
  score = 0;
  gameOver = false;
}

addEventListener('keydown', e => {
  if (gameOver && e.key === ' ') reset();
});

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
